name: 選擇權即時T字報價

# 台北時間對照（GitHub cron 用 UTC，UTC+8）：
#   日盤 08:45–13:45 → UTC 00:45–05:45
#   夜盤 15:00–次日05:00 → UTC 07:00–21:00（同一 UTC 日）
#
# 排程間隔 15 分鐘，分鐘數為何是 2/17/32/47：
#   GitHub 的 schedule 只是「盡力而為」，高負載時會直接丟掉整次排程。
#   整點與 5 的倍數是全球排程最壅塞的時刻，刻意錯開到沒人搶的分鐘，
#   提高真的被排到的機率。
#
# 分工：排程只更新網頁；要即時數據時到 Actions 手動 Run，預設會一起推播到手機。
on:
  schedule:
    - cron: '2,17,32,47 0-5 * * 1-5'     # 日盤
    - cron: '2,17,32,47 7-21 * * 1-5'    # 夜盤
  workflow_dispatch:
    inputs:
      notify:
        description: '同時推播摘要到 iPhone (ntfy)'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的（部署很快，15 分鐘間隔足夠）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 正常一次 30～50 秒就跑完。設上限是避免某次卡在網路等待，
    # 一路佔住 pages 這個 concurrency group，把後面每一次排程都堵在後面排隊。
    # 抓 12 分鐘是為了讓 deploy-pages 自己那 10 分鐘的等待跑完再放棄——設 8 分鐘會
    # 在它還在等 Pages 回應時就把 job 砍掉，log 只留下一句 canceled，看不出真正卡在哪。
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 產生即時 T 字報價網頁
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL:   ${{ vars.PAGE_URL }}
        run: |
          python3 "即時選擇權T字報價.py" --out public/index.html ${{ (github.event_name == 'workflow_dispatch' && inputs.notify) && '--notify' || '' }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
